# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Plant-FATE Simulation configuration
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# [inputs and outputs]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# If met/co2 should not be read/updated from file, set metFile/co2File to "null"
# Traits file should have the following columns in order: 
#       Family, Species, blank column, blank column, Wood density (g cm-3), Max height (m), LMA (g m-2), P50 (MPa), further columns are ignored.
#       Simulated species are read from the traits file, and should be <= the number of entries in the traits file. 
#       This is just a convenience feature to allow simulations with different numbers of prescribed species

# Traits file should have the following columns in order: 
#       Family, Species, blank column, blank column, Wood density (g cm-3), Max height (m), LMA (g m-2), P50 (MPa), further columns are ignored.
traitsFile = tests/data/traits_boreal_canopy_understorey.csv
nSpecies   = 1       # Number of species to simulate - these are read from traits file, so should be <= number of entries in traits file. 

# Forcing data: i_metFile should contain instantaneous forcing, 
#               a_metFile should contain acclimation forcing
# Metfiles must have the following columns in order: 
#      Year, Month, Decimal_year, Temp (deg C), VPD (hPa), PAR (umol m-2 s-1), PAR_max (umol m-2 s-1), SWP (-MPa, i.e., absolute value), further columns are ignored
i_metFile    = tests/data/ERAS_Monthly.csv
a_metFile    = tests/data/ERAS_Monthly.csv

# CO2 file must have the following columns in order:
#      Year, CO2 (ppm)
co2File    = null # tests/data/CO2_ELE_AmzFACE2000_2100.csv

outDir     = pspm_output_test		# output dir name, output path will be Plant-FATE-dir/outDir
exptName   = boreal_monthly_calibration		# expt name - results will be stored in outDir/exptName

emgProps       = D_PFATE.csv        # Output filename to output yearly community-level emergent properties e.g. GPP, LAI, VCMAX 
cwmAvg         = Y_mean_PFATE.csv   # Output filename to output yearly community-weighted-mean species-level properties e.g. density, mortality, basal area
cwmperSpecies  = Y_PFATE.csv        # Output filename to output yearly species-specific properties as above
traits         = traits.csv         # Output filename for species-specific evolving trait values 

saveState          = yes
savedStateFile     = pf_saved_state.txt
savedConfigFile    = pf_saved_config.ini
saveStateInterval  = 1000          # interval after which a complete simulation state is written [Years]

# stateFile and configFile if simulation should continue from a saved state. Otherwise, specify "null" 
continueFromState  = null # pspm_output_ewd_scan/par_ea-1.1493_eg-1.8392_ewd-0.8/2000.000000_pf_saved_state.txt # pspm_output11/test_spinup/pf_saved_state.txt  # Set to null if fresh start desired
continueFromConfig = null # pspm_output_ewd_scan/par_ea-1.1493_eg-1.8392_ewd-0.8/2000.000000_pf_saved_config.ini # pspm_output11/test_spinup/pf_saved_config.ini # Set to null if fresh start desired

# [Trait evolution]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
evolveTraits = no           # Whether traits should evolve via oligomorphic dynamics
evolvableTraits = wood_density hmat        # Which traits should evolve?
traitScalars = 800 25       # Scalars to normalize trait values, such that trait/scalar ~ O(1)
traitVariances = 0.02 0.02  # Intraspecific variance in normalized trait
T_r0_averaging = 100        # Interval over which r0 should be averaged [Years]

# [PSPM Solver] 
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
solver             = IEBT   # PSPM Solver to be used - Keep this IEBT. IFMU could be used if IEBT fails, but it is not very accurate
resolution         = 5      # This is the initial number of cohorts in IEBT solver or grid resolution in IFMU. For IEBT, a low number is fine unless a specific initial density is desired.
timestep           = 0.0833333333333    # Simulation timestep
time_unit          = years CE # time unit used for specifying start_time, end_time, and intervals
T_cohort_insertion = 1      # Cohort insertion timestep, only used by IEBT solver [Years] 

# [Core traits]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# These are default values
lma          = 0.086         # leaf mass per leaf area [kg/m2] (Poorter, 2009, Junttila, 2022)
zeta         = 0.2           # fine root mass per leaf area [kg/m2] (Now unused)
fcr          = 0.2           # coarse root mass per unit stem mass [REF: GRoot database]
hmat         = 30		         # maximum height [m]
fhmat        = 0.6           # height at reproductive maturity as fraction of hmat [Guesstimate]
# CHNAGED PARAMETER: VERSION 1, Joanna's Guess (4.5-7.5 mg)
seed_mass    = 1e-4         # [kg]
wood_density = 412          # [kg/m3] (Repola)
p50_xylem    = -2.29        # Xylem P50 [MPa] (Jaideep Calibration)
K_leaf       = 4.1311874912949e-17		   # Leaf conductance [m]  ---> ** Calibrated to gs ** (Jaideep Calibration)
K_xylem      = 4e-16		    # Leaf conductance [m]
b_leaf       = 1			      # Shape parameter of leaf vulnerabilty curve [-] (Ref: Joshi et al 2022)
b_xylem      = 1            # Shape parameter of xylem vulnerabilty curve [-] 
sm_xylem     = 0.3          # Xylem safety margin (P50x - Pg88) [MPa]
a            = 150          # height-diameter allometry (Used Halme to fit)
c            = 450          # crown area allometry (Used Halme to fit)
m            = 2.0	          # crown shape smoothness, (Used Halme to fit)
n            = 1.5         # crown top-heaviness, (Used Halme to fit)
fg           = 0.15         # upper canopy gap fraction (Rautiainen and Stenberg, 2015)
# NOTE: if the leaf parameters aren't from the same space, you get NA values

# [Phydro params]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
kphio = 0.08                   # Quantum yield efficiency (Jaideep Calibration, edited)
alpha = 0.05                 # Cost of maintaining photosynthetic capacity (Ref: Joshi et al 2022, removed shrubs and gymnosperms) 
gamma = 0.180496537959982      # Cost of maintaining hydraulic pathway  (Ref: Joshi et al 2022, removed shrubs and gymnosperms) (Jaideep Calibration)
a_jmax = 3700

# [LAI model]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
optimize_lai        = 0      # Should LAI be optimized? 0 = no, 1 = yes
Cc                  = 0.3    # Leaf construction costs per unit mass 
Chyd                = 0.00   # Hydraulic cost of keeping leaves
response_intensity  = 3      # speed of LAI response. This gives ~3 months response lag
lai_deriv_step      = 1e-4   # stepsize to calculate profit derivative wrt LAI
max_alloc_lai		    = 0.2    # max fraction of npp that can be allocated to LAI increment
lai0                = 4.5    # (Hyytiälä data)

# [Root model]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
root_no0                = 3e5        # Initial root number per m2 crown area (Ostonen TODO)
root_length0            = 1.5        # Initial length [mm] (Ding, 2021)
nitrogen_start0         = 0.39       # Total nitrogen 390 g N tree-1 (Korhonen 2013) for the biomass let's say free nitrogen is 10% [TODO: guess, reference?]
nitrogen_uptake0        = 1.5        # Initalisation for the nitorgen uptake [kg N ha-1 yr-1 to g N tree-1 month-1]. Assuming stocking density of 680. Used for the initalisation, but should be recaluclated before nitrogen uptake is used in the life history functions.

k_1                 = 0.35             # Fitting parameter for root length [mm3/2] (Ding), Diameter-length allometry constant
k_2                 = 0.2              # Fitted parameter for woody plants [unitless] (Kong, 2019), Fitting parameter in PRD equation
k_3                 = 0.014            # Fitted parameter for woody plants [mm] (Kong, 2019), Coefficient in root density equation
k_4                 = 11632.91276      # Fitted parameter root density [kg m-3] (Ding), Intercept in root density equation
k_5                 = -334.3626755     # Fitted parameter root density [kg m-3] (Ding), Alternate intercept (not used)
k_6                 = 3                # Fitted parameter root lifespan [mm-1] (Ding), Coefficient in age equation
k_7                 = 3                # Fitted parameter root lifespan [years] (Ding), Max root age
k_10                = 0.18             # [Percentage] of nitrogen in the storage of the needles compared to the rest of the biomass of the tree. Calculated two ways from Korhonen 2013, 15% and 20% were the answers, so taken 18%
k_14                = 0.5              # Retranslation (Korhonen, 2013)

nc_leaf             = 0.009615385         # Korhonen 2013 [1/C:N ratio]
nc_root             = 0.02                # Ding data, root order 1-3 [1/C:N ratio]
nc_wood             = 0.01                # Korhonen 2013 [1/C:N ratio]
nc_myco             = 0.02                # TODO:

# [Ectomycorrhiza model]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
mycorrhizal_biomass_conversion = 2.27  # The biomass conversion 1.5 of mass per carbon unit of sugar [kg Biomass per g sugar], (Biomass Maintenace respiration ?, 44% C Zhang & Elser, 2017)
mycorrhizal_turnover           = 2     # The amount of ectomycorrhizal turnover and Respiration [kg biomass per year] (0.05 Repiration and tunrover 6 - 1 depending on forest age from Hagenbo, 2015)
investment_from_tree           = 0.1   # [Percentage] of sugar from photosynthesis to ectomycorrhiza (Within CASSIA bounds Ryhti 2022)

# [Nitrogen]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
k_8                 = 2.7           # [Years] (Ilvonen), Age response threshold
k_9                 = 0.2           # [kg root] TODO: fix this value, Saturation parameter in nitrogen gate
k_20                = 2.0           # [Ratio] The diameter of the root system based off the crown area (Göttlicher, 2008)  
k_21                = 0.1           # [Percentage] Porosity of the soil and encroachment of other root systems
k_23                = 0.1           # [kg N m-3]
mycorrhized         = 0.9           # [Percentage] of roots covered (Heinonsalo)
myco_diameter       = 1e-5          # [2-20 um] Average mycelial diameter (Raghukumar 2017)
rho_myco            = 330           # [kg m-2] Mycorrhizal tissue density (van Veen and Paul, 1979)
D                   = 1e-4          # [kg N m-2 year-1] Diffusion in soil
N_s                 = 0.5           # [kg N m-3] Nitrogen concentration 
u_max               = 0.088          # [kg N m-2 year-1] Area-basd maximum uptake (Zhong, 2014 more reference in overleaf)
depth               = 0.5           # [m] TODO: think this parameter through more throughly

# [Leaf economics]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# For all values below, Ref: Wang et al 2021 Leaf economics
les_u       = 35.28       # [dimensionless] (Joanna: Fitted for a boreal forest), 768
les_k1      = 24.5     # g biomass / mol CO2 (see cbio below)
les_k2      = 0.0864   # (mol-CO2/day) / (umol-CO2/s)
les_hT_dH   = 65.33e3  # J mol-1
les_hT_c    = 26.35    # - 
les_molar_R = 8.31     # J mol-1 K-1
les_cc      = 13       # dimensionless    (Ref: Colin)

# [NPP, Respiration, and turnover]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
rd   = 0.011      # ratio of leaf dark respiration rate to vcmax [-]  (Ref: 0.011 in Farquhar et al 1980, 0.015 in Collatz et al 1991)
rr   = 0.04       # Fine root respiration rate per unit biomass per unit productivity [m2 kg-1]    0.4*1e3*1e-4*12/0.6/6.5 = 0.4 [MgC ha-1 mo-1] * 1e-3 [kgC/MgC] * 12 [mo yr-1] * 1e-4 [ha m-2] / 0.6 [m_fr, kgC m-2] / 6.5 [GPP kg m-2 yr-1] = [yr-1] / [GPP kg m-2 yr-1]   (0.4 from Doughty et al 2017 biotropica)
rs   = 0.04      # sapwood respiration rate per unit sapwood mass [yr-1] ---> Calibrated to NPP (TODO!)
p50x_cost = 0.08  # Extra respiratory cost of maintaining P50, per unit sapwood mass per unit P50 [yr-1 MPa-2] ---> calibrated to observed P50 
cbio = 2.45e-2    # kg biomass per mol CO2 = 12.011 gC / mol CO2 * 1e-3 kgC/gC * 2.04 kg biomass/kgC
y    = 0.75		  # yield factor accounting for growth respiration Ref: Educated guess, also used in other models)

# [Canopy light transmission]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# TODO: references for this!
k_light	= 0.24		# Light extinction coefficient

# [Seed production, dispersal, and germination]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
a_f1        = 0.3    # Max fraction of npp invested into reproduction
a_f2        = 10     # steepness of switch to reproduction
Sd          = 1e-5   # probability of seed survival during dispersal  --> Calibrated to various
npp_Sghalf  = 0.15   # Required annual productivity [kgC m-2 yr-1] for 50% probability of survival during germination --> Guesstimate

# [Mortality]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# All rates are in yr-1
cD0       = 0.08  # cD0*(D)^eD0        # ** Calibrated to BA, AGB **
eD0       = 1.3                        # ** Calibrated to size distribution
cD1       = 0.05  # cD1*exp(-D/0.01)   # 
cWD0      = 600
eWD       = -0.8
m_hydraulic = 0
# Source for below values: Falster et al
m_alpha   = 0.0598              
m_beta    = 18.7159
m_gamma   = 0.0094
eWD_alpha = -1.1493
eWD_gamma = -1.8392

# [Disturbance and succession]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
T_return         = 1000000     # return interval of disturbance [Years]
T_seed_rain_avg  = 0.099       # interval over which seed rain is averaged [Years]
T_invasion       = 200000      # interval after which a random new species is added [Years]

# [Background canopy for LifeHistory model]
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Openness decays from bg_canopy_openness_ini at bg_canopy_t0 toward
# bg_canopy_openness_eq with e-folding time bg_canopy_tau [years].
bg_canopy_z              = 20.0   # background canopy height [m]
bg_canopy_openness_ini   = 1.0    # openness at succession start (1 = fully open)
bg_canopy_openness_eq    = 0.3   # equilibrium canopy openness (closed forest)
bg_canopy_tau            = 25.0   # e-folding timescale of canopy closure [years]
bg_canopy_t0             = 1960.0 # year succession begins
